<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ultron AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<section id="auth" hidden>
  <div class="auth-card">
    <h1>ULTRON<span>AI</span></h1>
    <p class="tag">Your own intelligence. Always on.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
    <div class="row"><button id="login" class="primary">Log in</button><button id="signup">Create account</button></div>
    <button id="google" class="ghost">Continue with Google</button>
    <p id="autherr" class="err"></p>
  </div>
</section>

<section id="app" hidden>
  <aside id="side">
    <div class="brand">ULTRON<span>AI</span></div>
    <button id="newchat" class="primary">+ New chat</button>
    <div id="chatlist"></div>
    <div class="foot">
      <button id="settings" class="ghost">Settings</button>
      <button id="logout" class="ghost">Log out</button>
    </div>
  </aside>
  <main>
    <header>
      <button id="menu" class="ghost">☰</button>
      <span id="title">New chat</span>
      <select id="model">
        <option value="gemini-2.5-flash">Fast (Flash)</option>
        <option value="gemini-2.5-flash-lite">Fastest (Lite)</option>
        <option value="gemini-2.5-pro">Smartest (Pro)</option>
      </select>
    </header>
    <div id="msgs"></div>
    <div id="previews"></div>
    <form id="composer">
      <label class="attach" title="Add images">＋<input id="file" type="file" accept="image/*" multiple hidden></label>
      <textarea id="input" rows="1" placeholder="Ask Ultron anything…"></textarea>
      <button id="send" class="primary">Send</button>
    </form>
  </main>
</section>

<dialog id="dlg">
  <h2>Settings</h2>
  <p>Paste your free Gemini API key. It stays in this browser only. Get one at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.</p>
  <input id="key" type="password" placeholder="Gemini API key">
  <label>Personality <textarea id="sys" rows="4" placeholder="e.g. Be direct, brilliant, and brief. Explain like I'm a busy student."></textarea></label>
  <div class="row"><button id="savecfg" class="primary">Save</button><button id="closecfg">Close</button></div>
</dialog>
<script type="module" src="js/app.js"></script>
</body>
</html>
